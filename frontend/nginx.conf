server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Project images, videos and the resume (mounted read-only from the host)
    location /media/ {
        alias /media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashed CRA bundles never change
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fall back to index.html so React Router handles deep links
    location / {
        try_files $uri $uri/ /index.html;
    }
}
